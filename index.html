<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOKARA Boutique</title>
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png?v=2">
<link rel="shortcut icon" href="favicon.ico?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<meta name="theme-color" content="#5A1422">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600&family=Tajawal:wght@400;500;700&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600&family=Tajawal:wght@400;500;700&display=swap"></noscript>
<style>
/* Layout: light beige boutique — announcement bar, airy hero with drawn SOKARA gift box, trust row, new-in carousel, category tiles, coffret banner. Deliberately one light look. */
:root{
  --bg:#F8F2EB; --cream:#EFE4D7; --surface:#FFFDFB; --ink:#2E1A1C; --muted:#7B6466; --line:#E6D7C7;
  --wine:#5A1422; --wine-2:#74202F; --gold:#B08A57; --on-wine:#F8EDE1; --wa:#1E8C4C; --ok:#2E7D4F;
  --display:"Cormorant Garamond", Georgia, "Times New Roman", serif;
  --body:"Jost", "Helvetica Neue", Arial, sans-serif;
  --arabic:"Tajawal", "Geeza Pro", "Segoe UI", Tahoma, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
html[lang="ar"] body{font-family:var(--arabic)}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3{font-family:var(--arabic);font-weight:700}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--wine)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.1;margin:0;text-wrap:balance;color:var(--wine)}
h2{font-size:clamp(1.9rem,4vw,2.6rem)}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit}
.eyebrow{font-size:.74rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);font-weight:500}
html[lang="ar"] .eyebrow{letter-spacing:0;font-size:.85rem}
section{padding-block:56px}
.title-rule{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:28px;text-align:center}
.title-rule::before,.title-rule::after{content:"";height:1px;background:var(--gold);opacity:.6;flex:0 1 110px}
.head{display:grid;gap:8px;margin-bottom:26px;max-width:640px}
.head p{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:12px 24px;border-radius:999px;font-weight:500;font-size:.95rem;text-decoration:none;border:1px solid transparent;cursor:pointer;background:none}
.btn-wine{background:var(--wine);color:var(--on-wine)}
.btn-wine:hover{background:var(--wine-2)}
.btn-line{border-color:var(--wine);color:var(--wine)}
.btn-wa{background:var(--wa);color:#fff}
.btn:focus-visible,.chip:focus-visible,.add:focus-visible,.tile:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.icon-btn:focus-visible,.arrow:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.ico{width:18px;height:18px;flex:none}
html[dir="rtl"] .flip{transform:scaleX(-1)}

/* announcement + header */
.announce{background:var(--wine);color:var(--on-wine);font-size:.8rem}
.announce .wrap{display:flex;gap:10px 22px;align-items:center;padding-block:8px;flex-wrap:wrap;justify-content:center}
.announce span{display:inline-flex;align-items:center;gap:7px}
@media (max-width:600px){.announce span:nth-child(n+2){display:none}}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:18px;padding-block:12px}
.brand{text-decoration:none;margin-inline-end:auto;display:grid;justify-items:center;line-height:1;color:var(--wine)}
.brand b{font-family:var(--display);font-size:1.7rem;letter-spacing:.32em;font-weight:600;padding-inline-start:.32em}
.brand small{display:flex;align-items:center;gap:8px;font-size:.62rem;letter-spacing:.38em;margin-top:4px}
.brand small::before,.brand small::after{content:"";width:18px;height:1px;background:currentColor}
.nav{display:flex;gap:26px;font-size:.93rem}
.nav a{text-decoration:none;padding-block:6px;border-bottom:1px solid transparent}
.nav a:hover{border-bottom-color:var(--wine)}
.ct-h{display:none;flex:none;align-items:center;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--wine);text-decoration:none;font-size:.85rem;font-weight:500}
@media (max-width:900px){.ct-h{display:inline-flex}}
.lang,.icon-btn{flex:none}
@media (max-width:440px){.bar{gap:8px}.brand b{font-size:1.15rem;letter-spacing:.24em;padding-inline-start:.24em}.brand small{font-size:.52rem;letter-spacing:.3em}.brand small::before,.brand small::after{width:12px}.lang button{padding:5px 9px;font-size:.8rem}}
@media (max-width:400px){.bar{gap:6px}.brand b{font-size:1rem;letter-spacing:.2em;padding-inline-start:.2em}.lang button{padding:4px 7px;font-size:.76rem}.icon-btn{width:34px}}
@media (max-width:400px){.ct-h{padding:0 9px;font-size:.78rem;height:30px}.lang button{padding:4px 6px}}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--bg)}
.lang button{border:0;background:none;padding:6px 12px;cursor:pointer;font-size:.85rem;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--wine);color:var(--on-wine)}
.icon-btn{position:relative;border:0;background:none;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.icon-btn .ico{width:22px;height:22px}
.count{position:absolute;top:0;inset-inline-end:0;background:var(--wine);color:var(--on-wine);font-size:.66rem;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px;font-variant-numeric:tabular-nums}
@media (max-width:900px){.nav{display:none}.brand b{font-size:1.4rem}}

/* hero */
.hero{background:radial-gradient(120% 90% at 80% 40%,#F3E7DA 0%,#EADBCB 55%,#E3D1BE 100%);padding-block:0;overflow:hidden}
.hero-grid{display:grid;grid-template-columns:1fr 1.05fr;gap:24px;align-items:center;min-height:440px}
.hero-text{padding-block:48px}
.hero h1{font-size:clamp(2.6rem,5.6vw,4.2rem);font-weight:600;margin-top:14px}
.hero h1 em{font-style:italic;font-weight:500}
.hero .lead{color:var(--ink);opacity:.8;font-size:1.05rem;margin-top:16px;max-width:30em}
.hero .cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.hero-art{align-self:end;justify-self:center;width:min(100%,540px)}
.hero-art svg{display:block;width:100%;height:auto}
@media (max-width:820px){.hero-grid{grid-template-columns:1fr;min-height:0}.hero-text{padding-block:36px 0}.hero-art{width:min(100%,420px)}}

.trust{background:var(--surface);border-bottom:1px solid var(--line)}
.trust .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
.trust div{display:flex;align-items:center;justify-content:center;gap:12px;padding:18px 10px;font-size:.88rem;line-height:1.3;border-inline-start:1px solid var(--line)}
.trust div:first-child{border-inline-start:0}
.trust svg{width:30px;height:30px;flex:none;color:var(--wine)}
@media (max-width:760px){.trust .wrap{grid-template-columns:1fr 1fr}.trust div{justify-content:flex-start}.trust div:nth-child(3){border-inline-start:0}.trust div:nth-child(n+3){border-top:1px solid var(--line)}}

/* new-in carousel */
.rail-wrap{position:relative}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(210px,1fr);gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail .card{scroll-snap-align:start}
.arrow{position:absolute;top:38%;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;z-index:2;box-shadow:0 2px 10px rgba(60,20,25,.08)}
.arrow.prev{inset-inline-start:-14px}.arrow.next{inset-inline-end:-14px}
@media (max-width:640px){.rail{grid-auto-columns:46%}.arrow{display:none}}

/* category tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:12px;overflow:hidden;cursor:pointer;padding:0;text-align:center;display:grid}
.tile .art{aspect-ratio:4/3;display:grid;place-items:center;background:var(--t,#EFE4D7)}
.tile .art svg{width:44%;height:auto;color:var(--wine)}
.tile span{padding:10px 8px;font-family:var(--display);font-size:1.12rem;font-weight:600;color:var(--ink)}
html[lang="ar"] .tile span{font-family:var(--arabic);font-size:1rem}
.tile:hover .art{filter:brightness(.97)}

/* coffret banner */
.banner{display:grid;grid-template-columns:1fr 1fr;align-items:center;background:linear-gradient(100deg,#F2E7DB 0%,#EADCCB 100%);border-radius:16px;overflow:hidden}
.banner .txt{padding:36px;display:grid;gap:12px;justify-items:start}
.banner .txt p{color:var(--muted)}
.banner svg{display:block;width:100%;height:auto;max-height:280px}
@media (max-width:760px){.banner{grid-template-columns:1fr}.banner .txt{padding:26px}}

/* catalogue */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;cursor:pointer;font-size:.92rem;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--wine);border-color:var(--wine);color:var(--on-wine)}
.subchips{margin-top:12px}
.subchips .chip{font-size:.85rem;padding:6px 14px;background:var(--cream);border-color:transparent}
.subchips .chip[aria-pressed="true"]{background:var(--gold);color:#fff}
.cat-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:24px 0 16px}
.cat-title span{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
@media (max-width:520px){.grid{grid-template-columns:1fr 1fr;gap:12px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card .ph{aspect-ratio:1/1;background:#F4ECE3;display:grid;place-items:center;position:relative}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.card .ph img.pack{object-fit:contain;padding:14px;background:#fff}
.card .ph i{font-style:normal;font-family:var(--display);font-size:3.2rem;color:var(--gold);opacity:.75}
.card .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:3px;flex:1}
.card h3{font-family:var(--body);font-size:.95rem;font-weight:500;line-height:1.3;color:var(--ink)}
html[lang="ar"] .card h3{font-family:var(--body);font-weight:500}
.card .note{color:var(--muted);font-size:.8rem}
.card .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:10px;flex-wrap:wrap}
.price{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.add{border:0;background:var(--wine);color:var(--on-wine);border-radius:8px;padding:7px 12px;font-size:.82rem;font-weight:500;cursor:pointer;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.add svg{width:15px;height:15px}
.add.done{background:var(--ok)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:26px;display:grid;gap:10px;justify-items:start;max-width:560px}
.empty p{color:var(--muted)}
.own{margin-top:18px;background:var(--cream);border-radius:12px;padding:20px;display:grid;gap:6px}
.own p{color:var(--muted);font-size:.94rem}

/* on demand */
.demand{background:var(--surface);border-block:1px solid var(--line)}
.demand-grid{display:grid;grid-template-columns:1fr 1.2fr;gap:36px}
.steps{display:grid;gap:14px;margin-top:20px;counter-reset:s}
.steps ol{padding:0;margin:0;display:grid;gap:14px}
.steps li{list-style:none;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}
.steps li::before{counter-increment:s;content:counter(s);width:34px;height:34px;border-radius:50%;border:1px solid var(--gold);color:var(--wine);display:grid;place-items:center;font-family:var(--display);font-size:1.2rem}
.steps p{color:var(--muted);font-size:.93rem}
.notice{background:var(--cream);border-radius:10px;padding:12px 14px;font-size:.92rem;margin-top:18px}
form.f{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:start}
.f .full{grid-column:1/-1}
label{display:grid;gap:5px;font-size:.85rem;font-weight:500;min-width:0}
input,select,textarea{font:inherit;font-size:1rem;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
textarea{min-height:76px;resize:vertical}
@media (max-width:820px){.demand-grid{grid-template-columns:1fr}}
@media (max-width:440px){form.f{grid-template-columns:1fr}}

/* loyalty */
.loyal{display:grid;grid-template-columns:1fr 1.1fr;gap:28px;align-items:center}
.card-fid{background:#F6E6E3;border:1px solid #EBCFCB;border-radius:18px;padding:24px;display:grid;gap:16px}
.card-fid .top{display:flex;align-items:center;gap:12px;color:var(--wine)}
.card-fid .top img{width:48px;height:48px;border-radius:50%}
.card-fid .top b{font-family:var(--display);font-size:1.4rem;letter-spacing:.16em}
.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.stamps span{aspect-ratio:1/1;border-radius:50%;border:1px dashed #C9A19C;display:grid;place-items:center;font-family:var(--display);font-size:1.25rem;color:var(--wine);background:#FBF2F0;font-variant-numeric:tabular-nums}
.stamps span.gift{background:var(--wine);color:var(--on-wine);border:0;font-family:var(--body);font-size:.68rem;text-align:center;line-height:1.1}
.rules{display:grid;gap:12px}
.rule{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.rule b.n{font-family:var(--display);font-size:1.7rem;color:var(--wine);min-width:52px;text-align:center}
.rule p{color:var(--muted);font-size:.92rem}
@media (max-width:820px){.loyal{grid-template-columns:1fr}}

/* info */
.info{background:var(--wine);color:var(--on-wine)}
.info h2{color:var(--on-wine)}
.info .eyebrow{color:var(--gold)}
.info .head p{color:var(--on-wine);opacity:.8}
.info-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.box-i{border:1px solid rgba(248,237,225,.25);border-radius:12px;padding:18px;display:grid;gap:4px;align-content:start}
.box-i .big{font-family:var(--display);font-size:2.3rem;color:var(--gold);line-height:1;font-variant-numeric:tabular-nums}
html[lang="ar"] .box-i .big{font-family:var(--arabic);font-size:2rem}
.box-i p{opacity:.85;font-size:.9rem}
@media (max-width:860px){.info-grid{grid-template-columns:1fr 1fr}}
@media (max-width:440px){.info-grid{grid-template-columns:1fr}}

/* reviews + contact */
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:grid;gap:12px;align-content:start}
.panel p{color:var(--muted)}
.socials{display:grid;gap:10px}
.socials a,.socials div{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;text-decoration:none;flex-wrap:wrap}
.socials span{color:var(--muted);font-size:.9rem}
.copy{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 12px;font-size:.8rem;cursor:pointer}
@media (max-width:820px){.two{grid-template-columns:1fr}}
footer{padding-block:28px;color:var(--muted);font-size:.88rem;text-align:center}

/* cart drawer */
.scrim{position:fixed;inset:0;background:rgba(40,15,20,.4);z-index:40}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(440px,100%);background:var(--surface);z-index:41;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:-12px 0 40px rgba(0,0,0,.15)}
.d-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.d-head h2{font-size:1.6rem}
.d-body{flex:1;overflow-y:auto;padding:14px 18px;display:grid;gap:14px;align-content:start}
.line{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.line .nm{font-weight:500;font-size:.95rem}
.line .pr{font-variant-numeric:tabular-nums;font-weight:600}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--bg);cursor:pointer}
.qty span{min-width:20px;text-align:center;font-variant-numeric:tabular-nums}
.rm{border:0;background:none;color:var(--muted);font-size:.82rem;cursor:pointer;justify-self:end}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;font-weight:400;background:var(--cream);padding:12px;border-radius:10px}
.check input{width:auto;margin-top:3px}
.sum{display:grid;gap:6px;font-size:.95rem;border-top:1px solid var(--line);padding-top:12px}
.sum div{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.sum .tot{font-size:1.15rem;font-weight:600}
.d-foot{padding:14px 18px;border-top:1px solid var(--line);display:grid;gap:8px}
.d-foot small{color:var(--muted);text-align:center}
.card .ph.open{border:0;padding:0;cursor:pointer;width:100%}
.card .ph img.gray,.pv img.gray{object-fit:contain;background:#EFEFEF}
.dots{display:flex;align-items:center;gap:5px;margin-top:4px}
.dots .dot{width:13px;height:13px;border-radius:50%;border:1px solid rgba(0,0,0,.15);display:inline-block}
.dots span{font-size:.75rem;color:var(--muted);margin-inline-start:4px}
.pv{position:fixed;z-index:45;left:50%;top:50%;transform:translate(-50%,-50%);width:min(880px,calc(100% - 24px));max-height:calc(100% - 40px);overflow-y:auto;background:var(--surface);border-radius:16px;box-shadow:0 20px 60px rgba(40,15,20,.25)}
.pv-x{position:absolute;top:8px;inset-inline-end:8px;background:var(--surface);z-index:2}
.pv-in{display:grid;grid-template-columns:1.1fr 1fr;gap:22px;padding:20px}
.pv-gal>img{width:100%;aspect-ratio:1/1;border-radius:10px;display:block}
.pv-th{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.pv-th button{border:1px solid var(--line);padding:0;border-radius:8px;overflow:hidden;width:62px;height:62px;cursor:pointer;background:#EFEFEF}
.pv-th button[aria-pressed="true"]{border:2px solid var(--wine)}
.pv-th img{width:100%;height:100%;object-fit:cover}
.pv-info{display:grid;gap:10px;align-content:start;padding-top:10px}
.pv-info h2{font-size:1.8rem}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sz{display:flex;flex-wrap:wrap;gap:6px}
.sz button{min-width:46px;padding:8px 10px;border:1px dashed var(--line);border-radius:8px;background:var(--bg);cursor:pointer;color:var(--muted)}
.sz button.in{border:1px solid var(--ink);color:var(--ink);font-weight:600}
.sz button[aria-pressed="true"]{background:var(--wine);border-color:var(--wine);color:var(--on-wine)}
.sw button span{text-align:center;line-height:1.2}
.sw button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:4px;cursor:pointer;display:grid;gap:3px;justify-items:center;width:76px}
.sw button[aria-pressed="true"]{border:2px solid var(--wine)}
.sw img{width:64px;height:64px;object-fit:contain;background:#EFEFEF;border-radius:6px}
.sw span{font-size:.75rem}
@media (max-width:700px){.pv-in{grid-template-columns:1fr;padding:14px}.pv{top:auto;bottom:0;transform:translateX(-50%);border-radius:16px 16px 0 0;max-height:92%;padding-bottom:env(safe-area-inset-bottom,0px)}}

function applyLang(){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  $("l-fr").setAttribute("aria-pressed", lang === "fr");
  $("l-ar").setAttribute("aria-pressed", lang === "ar");
  document.querySelectorAll("[data-i]").forEach(el => {
    if (el.hasAttribute("data-html")) el.innerHTML = t(el.dataset.i); else el.textContent = t(el.dataset.i);
  });
  document.querySelectorAll("[data-msg]").forEach(a => { a.href = wa(t(a.dataset.msg)); a.target = "_blank"; a.rel = "noopener"; });
  $("d-city").innerHTML = CITIES.map(c => `<option>${c}</option>`).join("");
  renderChips(); renderGrid(); renderCart(); renderRail(); renderTiles();
}

function renderChips(){
  $("chips").innerHTML = CATS.map(c => `<button type="button" class="chip" data-c="${c[0]}" aria-pressed="${c[0]===cat}">${catLabel(c)}</button>`).join("");
  const c = CATS.find(x => x[0] === cat);
  const subs = c[3] || [];
  $("subchips").hidden = !subs.length;
  $("subchips").innerHTML = subs.length ? [`<button type="button" class="chip" data-s="" aria-pressed="${sub===""}">${t("all")}</button>`]
    .concat(subs.map(s => `<button type="button" class="chip" data-s="${s[0]}" aria-pressed="${s[0]===sub}">${lang==="ar"?s[2]:s[1]}</button>`)).join("") : "";
}

const TILE = {parfums:["#F1E3DC",'<path d="M26 10h12v6H26zM22 18h20l2 6v26a4 4 0 0 1-4 4H24a4 4 0 0 1-4-4V24z"/><path d="M32 4v6"/>'],
 rituals:["#EADFD3",'<rect x="12" y="20" width="40" height="32" rx="2"/><path d="M12 30h40M32 20v32M32 20c-6-8-16-10-16-4s10 4 16 4c6 0 16 2 16-4s-10-4-16 4"/>'],
 sacs:["#EFE2D6",'<path d="M14 24h36l-3 28H17zM24 24v-6a8 8 0 0 1 16 0v6"/>'],
 accessoires:["#F2E6DE",'<circle cx="32" cy="34" r="14"/><path d="M26 20l6-10 6 10"/>'],
 pyjamas:["#EDE3DA",'<path d="M22 12l-10 8 5 8 5-3v27h20V25l5 3 5-8-10-8c-2 4-6 6-10 6s-8-2-10-6z"/>'],
 vitamines:["#F3E9D5",'<rect x="14" y="26" width="36" height="14" rx="7" transform="rotate(-35 32 33)"/><path d="M25 22l12 18"/>'],
 tisanes:["#E6E7D8",'<path d="M14 26h30v10a14 14 0 0 1-28 0zM44 29h4a5 5 0 0 1 0 10h-5M22 18c0-4 4-4 4-8M30 18c0-4 4-4 4-8"/>'],
 kbeauty:["#F3E1E1",'<path d="M24 10h16v8H24zM20 18h24v34a2 2 0 0 1-2 2H22a2 2 0 0 1-2-2z"/><path d="M26 34h12"/>'],
 visage:["#F4E8DF",'<circle cx="32" cy="30" r="16"/><path d="M26 28h1M37 28h1M26 37c3 3 9 3 12 0"/>'],
 makeup:["#EFDDE0",'<path d="M26 54V30h12v24zM28 30l2-16 6 4v12"/>'],
 cheveux:["#EADCCD",'<path d="M20 54c-6-20 0-40 12-44 12 4 18 24 12 44M28 20c-2 12 0 24 4 34M36 20c2 12 0 24-4 34"/>'],
 mainspieds:["#F2E5DC",'<path d="M22 54V30l-6-10a3 3 0 0 1 5-3l5 8V12a3 3 0 0 1 6 0v12-14a3 3 0 0 1 6 0v14-10a3 3 0 0 1 6 0v22c0 10-4 18-10 18z"/>'],
 corps:["#F1E4D8",'<path d="M20 22h24v28a4 4 0 0 1-4 4H24a4 4 0 0 1-4-4zM24 22V14h16v8"/><path d="M26 34h12"/>'],
 masques:["#E9E3DB",'<path d="M12 22c8-6 32-6 40 0 0 18-8 30-20 30S12 40 12 22z"/><path d="M22 30h6M36 30h6M28 42h8"/>'],
 boxes:["#F0DADA",'<rect x="12" y="26" width="40" height="26" rx="2"/><rect x="9" y="18" width="46" height="9" rx="2"/><path d="M32 18v34M32 18c-6-8-16-10-16-4s10 4 16 4c6 0 16 2 16-4s-10-4-16 4"/>'],
 chaussures:["#F0E2DA",'<path d="M8 40c6 0 12-4 16-12l4 2c2 6 8 10 16 10h8a4 4 0 0 1 4 4v4H8z"/><path d="M8 48h48"/>'],
 dentaire:["#E3ECEF",'<path d="M20 12c-6 0-9 5-8 12 1 8 4 12 5 22 1 6 6 6 7 0l2-10c1-3 5-3 6 0l2 10c1 6 6 6 7 0 1-10 4-14 5-22 1-7-2-12-8-12-4 0-6 2-9 2s-5-2-9-2z"/>'],
 maison:["#E6E3DA",'<path d="M10 30 32 12l22 18M16 26v26h32V26"/><path d="M27 52V38h10v14"/>']};
function renderTiles(){
  $("tiles").innerHTML = CATS.map(c => { const tl = TILE[c[0]] || ["#EFE4D7",""];
    return `<button type="button" class="tile" data-c="${c[0]}" data-go style="--t:${tl[0]}"><div class="art"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">${tl[1]}</svg></div><span>${catLabel(c)}</span></button>`; }).join("");
}
function renderRail(){ $("rail").innerHTML = NEW_IN.filter(id => byId[id]).map(id => cardHTML(byId[id])).join(""); }
function cardHTML(p){
  const [id,, , name, note, price, img0, colors] = p;
  if (colors) {
    const im = IMG[colors[0][3][0]];
    const isSize = p[8] === "size";
    const dots = isSize ? "" : colors.map(c => `<i class="dot" style="background:${c[2]}" title="${c[0]}"></i>`).join("");
    const prices = colors.map(c => c[4] || price); const minP = Math.min(...prices);
    const sizeTxt = colors.map(c => c[0].split(" · ")[0]).join(" · ");
    return `<article class="card"><button type="button" class="ph open" data-open="${id}" aria-label="${name}"><img class="gray" src="${im}" alt="${name}" loading="lazy" decoding="async"></button><div class="body"><h3>${name}</h3><p class="note">${Array.isArray(note) ? (lang==="ar" ? note[1] : note[0]) : note}</p><div class="dots">${dots}<span>${p[9] ? (p[9].all.length > 1 ? p[9].all[0] + "–" + p[9].all[p[9].all.length-1] : t("taille") + " " + p[9].all[0]) + (colors.length > 1 ? " · " + colors.length + " " + t("colors") : "") : isSize ? sizeTxt : (colors.length > 1 ? colors.length + " " + t("colors") : (lang==="ar"?colors[0][1]:colors[0][0]))}</span></div>
    <div class="foot"><span class="price">${price ? (prices.length > 1 && new Set(prices).size > 1 ? t("from") + " " + minP : minP) + " DH" : t("ask")}</span><button type="button" class="add" data-open="${id}">${t("choose")}</button></div></div></article>`;
  }
  const img = img0;
  const ph = img && IMG[img] ? `<img src="${IMG[img]}" alt="${name}" loading="lazy"${PACK.has(img)?' class="pack"':''}>` : `<i>${name.trim()[0]}</i>`;
  const inCart = cart[id];
  return `<article class="card"><div class="ph">${ph}</div><div class="body"><h3>${name}</h3><p class="note">${Array.isArray(note) ? (lang==="ar" ? note[1] : note[0]) : note}</p>
    <div class="foot"><span class="price">${price} DH</span><button type="button" class="add${inCart?" done":""}" data-add="${id}">${inCart?t("added"):t("add")}</button></div></div></article>`;
}

function renderGrid(){
  const c = CATS.find(x => x[0] === cat);
  const subObj = (c[3]||[]).find(s => s[0] === sub);
  $("catName").textContent = subObj ? (lang==="ar"?subObj[2]:subObj[1]) : catLabel(c);
  let list = P.filter(p => p[1] === cat && (!sub || p[2] === sub));
  let extra = "";
  if (cat === "boxes" && (sub === "own" || sub === "")) {
    extra = `<div class="own"><h3>${t("own_h")}</h3><p>${t("own_p")}</p></div>`;
    if (sub === "own") list = [];
  }
  $("grid").innerHTML = list.map(cardHTML).join("");
  $("catCount").textContent = list.length ? list.length + " " + t("items") : "";
  if (!list.length && !extra) extra = `<div class="empty"><h3>${t("empty_h")}</h3><p>${t("empty_p")}</p><a class="btn btn-wine" href="#demande">${t("empty_b")}</a></div>`;
  $("extra").innerHTML = extra;
}

function item(key){
  const [id, ci, sz] = key.split("|"); const p = byId[id]; if (!p) return null;
  const c = p[7] && ci !== undefined ? p[7][+ci] : null;
  const order = sz && p[9] && !p[9].stock.includes(sz);
  const szTxt = sz ? " · " + (lang === "ar" ? "المقاس " : "Taille ") + sz + (order ? (lang === "ar" ? " (بالطلب)" : " (sur commande)") : "") : "";
  const szFr = sz ? " · Taille " + sz + (order ? " (sur commande)" : "") : "";
  return {p, price: (c && c[4]) || p[5], name: p[3] + (c ? " · " + (lang === "ar" ? c[1] : c[0]) : "") + szTxt, fr: p[3] + (c ? " · " + c[0] : "") + szFr};
}
function totals(){
  const ids = Object.keys(cart);
  const n = ids.reduce((s,id) => s + cart[id], 0);
  const subtotal = ids.reduce((s,id) => s + item(id).price*cart[id], 0);
  const giftOn = !!(store.get("sk_gift")) ;
  const disc = giftOn && n >= BOX_MIN ? Math.round(subtotal*BOX_DISCOUNT) : 0;
  const city = store.get("sk_city") || "agadir";
  const del = n ? DELIVERY[city] : 0;
  return {ids, n, subtotal, giftOn, disc, city, del, total: subtotal - disc + del};
}

function renderCart(){
  const s = totals();
  $("count").textContent = s.n;
  const saved = store.get("sk_form") || {};
  if (!s.n) { $("dBody").innerHTML = `<p style="color:var(--muted)">${t("cart_empty")}</p>`; return; }
  $("dBody").innerHTML = s.ids.map(id => { const it = item(id); return `<div class="line"><span class="nm">${it.name}</span><span class="pr">${it.price*cart[id]} DH</span>
     <div class="qty"><button type="button" data-q="${id}" data-d="-1" aria-label="moins">−</button><span>${cart[id]}</span><button type="button" data-q="${id}" data-d="1" aria-label="plus">+</button></div>
     <button type="button" class="rm" data-rm="${id}">✕</button></div>`; }).join("") + `
    <label class="check" for="giftBox"><input type="checkbox" id="giftBox" ${s.giftOn?"checked":""}><span>${t("gift_box")}</span></label>
    <label for="c-city">${t("city")}<select id="c-city"><option value="agadir" ${s.city==="agadir"?"selected":""}>${t("agadir")}</option><option value="other" ${s.city==="other"?"selected":""}>${t("other")}</option></select></label>
    <label for="c-name">${t("name")}<input id="c-name" type="text" value="${(saved.name||"").replace(/"/g,"&quot;")}"></label>
    <label for="c-phone">${t("phone")}<input id="c-phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="06 00 00 00 00" value="${(saved.phone||"").replace(/"/g,"&quot;")}"></label>
    <label for="c-addr">${t("addr")}<textarea id="c-addr">${(saved.addr||"").replace(/</g,"&lt;")}</textarea></label>
    <label for="c-promo">${t("promo")}<input id="c-promo" type="text" value="${(saved.promo||"").replace(/"/g,"&quot;")}"></label>
    <div class="sum"><div><span>${t("sub")}</span><span>${s.subtotal} DH</span></div>
      ${s.disc?`<div><span>${t("disc")}</span><span>−${s.disc} DH</span></div>`:""}
      <div><span>${t("deliv")}</span><span>${s.del} DH</span></div>
      <div class="tot"><span>${t("total")}</span><span>${s.total} DH</span></div>
      <small style="color:var(--muted)">${t("promo_note")}</small></div>`;
}

let pv = {id:null, c:0, i:0, s:null};
function openProduct(id, c, i, s){
  const p = byId[id]; if (!p || !p[7]) return; if (p[9] && !s) s = p[9].stock[0]; pv = {id, c, i, s: p[9] ? s : null};
  const col = p[7][c], imgs = col[3];
  $("pvBody").innerHTML = `<div class="pv-gal"><img class="gray" src="${IMG[imgs[i]]}" alt="${p[3]} ${col[0]}">
    <div class="pv-th">${imgs.map((k,j) => `<button type="button" data-th="${j}" aria-pressed="${j===i}" aria-label="Photo ${j+1}"><img src="${IMG[k]}" alt=""></button>`).join("")}</div></div>
    <div class="pv-info"><h2>${p[3]}</h2><p class="note">${p[4]}</p><p class="price" style="font-size:1.5rem">${p[5] ? (col[4] || p[5]) + " DH" : t("ask")}</p>
    <p><b>${t(p[8]==="size" ? "size" : "color")} :</b> ${lang==="ar"?col[1]:col[0]}</p>
    <div class="sw">${p[7].map((cc,j) => `<button type="button" data-sw="${j}" aria-pressed="${j===c}" aria-label="${cc[0]}"><img src="${IMG[cc[3][0]]}" alt=""><span>${lang==="ar"?cc[1]:cc[0]}</span></button>`).join("")}</div>
    ${p[9] ? `<p><b>${t("taille")} :</b> ${pv.s}${p[9].stock.includes(pv.s) ? "" : " · " + t("onorder")}</p><div class="sz">${p[9].all.map(z => `<button type="button" data-sz="${z}" aria-pressed="${z===pv.s}" class="${p[9].stock.includes(z) ? "in" : ""}">${z}</button>`).join("")}</div>${p[9].all.length > p[9].stock.length ? `<p class="note">${t("sznote")}</p>` : ""}` : ""}
    ${p[5] ? `<button type="button" class="btn btn-wine" id="pvAdd" style="margin-top:8px">${t("addcart")}</button>` : `<a class="btn btn-wa" style="margin-top:8px" target="_blank" rel="noopener" href="${wa("Bonjour SOKARA, quel est le prix du " + p[3] + " (" + col[0] + ") ?")}">${t("askbtn")}</a>`}</div>`;
  $("pv").hidden = false; $("pvScrim").hidden = false;
}
function closeProduct(){ $("pv").hidden = true; $("pvScrim").hidden = true; }
function save(){ store.set("sk_cart", cart); renderCart(); }
function toast(msg){ const el = $("toast"); el.textContent = msg; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 1600); }
function openCart(o){ $("drawer").hidden = !o; $("scrim").hidden = !o; }

document.addEventListener("click", e => {
  const c = e.target.closest("[data-c]"); if (c) { cat = c.dataset.c; sub = ""; renderChips(); renderGrid(); if (c.hasAttribute("data-go")) $("catalogue").scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); return; }
  const s = e.target.closest("[data-s]"); if (s) { sub = s.dataset.s; renderChips(); renderGrid(); return; }
  const o = e.target.closest("[data-open]"); if (o) { openProduct(o.dataset.open, 0, 0, null); return; }
  const zz = e.target.closest("[data-sz]"); if (zz) { openProduct(pv.id, pv.c, pv.i, zz.dataset.sz); return; }
  const sw = e.target.closest("[data-sw]"); if (sw) { openProduct(pv.id, +sw.dataset.sw, 0, pv.s); return; }
  const th = e.target.closest("[data-th]"); if (th) { openProduct(pv.id, pv.c, +th.dataset.th, pv.s); return; }
  if (e.target.closest("#pvAdd")) { const k = pv.id + "|" + pv.c + (pv.s ? "|" + pv.s : ""); cart[k] = (cart[k]||0) + 1; save(); closeProduct(); toast(t("toast")); return; }
  if (e.target.closest("#pvClose") || e.target.id === "pvScrim") { closeProduct(); return; }
  const a = e.target.closest("[data-add]"); if (a) { const id = a.dataset.add; cart[id] = (cart[id]||0) + 1; save(); renderGrid(); renderRail(); toast(t("toast")); return; }
  const q = e.target.closest("[data-q]"); if (q) { const id = q.dataset.q; cart[id] += +q.dataset.d; if (cart[id] <= 0) delete cart[id]; save(); renderGrid(); return; }
  const r = e.target.closest("[data-rm]"); if (r) { delete cart[r.dataset.rm]; save(); renderGrid(); return; }
});
$("dBody").addEventListener("change", e => {
  if (e.target.id === "giftBox") { store.set("sk_gift", e.target.checked); renderCart(); }
  if (e.target.id === "c-city") { store.set("sk_city", e.target.value); renderCart(); }
});
$("dBody").addEventListener("input", e => {
  if (["c-name","c-phone","c-addr","c-promo"].includes(e.target.id)) store.set("sk_form", {name:$("c-name").value, phone:$("c-phone").value, addr:$("c-addr").value, promo:$("c-promo").value});
});
["railPrev","railNext"].forEach((id,i) => $(id).onclick = () => { const r = $("rail"); const dir = (i ? 1 : -1) * (document.documentElement.dir === "rtl" ? -1 : 1); r.scrollBy({left: dir * r.clientWidth * .8}); });
$("openCart").onclick = () => openCart(true);
$("closeCart").onclick = () => openCart(false);
$("scrim").onclick = () => openCart(false);
document.addEventListener("keydown", e => { if (e.key === "Escape") { openCart(false); closeProduct(); } });
$("l-fr").onclick = () => { lang = "fr"; store.set("sk_lang", lang); applyLang(); };
$("l-ar").onclick = () => { lang = "ar"; store.set("sk_lang", lang); applyLang(); };

$("sendOrder").onclick = () => {
  const s = totals(); if (!s.n) { toast(t("need")); return; }
  const f = store.get("sk_form") || {};
  const lines = s.ids.map(id => `• ${item(id).fr} × ${cart[id]} = ${item(id).price*cart[id]} DH`).join("\n");
  const msg = `Bonjour SOKARA, nouvelle commande ✨\n\n${lines}\n\nSous-total : ${s.subtotal} DH` +
    (s.giftOn ? `\nBox cadeau : oui${s.disc?` (−${s.disc} DH)`:""}` : "") +
    `\nLivraison : ${s.del} DH (${s.city==="agadir"?"Agadir":"Autre ville"})\nTotal : ${s.total} DH` +
    (f.promo ? `\nCode promo : ${f.promo}` : "") +
    `\n\nNom : ${f.name||""}\nTéléphone : ${f.phone||""}\nAdresse : ${f.addr||""}\n\nMerci de confirmer ma commande.`;
  window.open(wa(msg), "_blank", "noopener") || (location.href = wa(msg));
};

$("demForm").addEventListener("submit", e => {
  e.preventDefault();
  const msg = `Bonjour SOKARA, je voudrais un prix pour ce produit (commande sur demande) :\n${$("d-link").value||"[lien]"}\n` +
    ($("d-det").value ? `Détails : ${$("d-det").value}\n` : "") + `Ville : ${$("d-city").value}` + ($("d-name").value ? `\nPrénom : ${$("d-name").value}` : "");
  window.open(wa(msg), "_blank", "noopener") || (location.href = wa(msg));
});

const EMAIL = "pharmawithsafira@gmail.com";
const mtoast = m => { let d = $("mtoast"); if (!d) { d = document.createElement("div"); d.id = "mtoast"; d.style.cssText = "position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#5A1422;color:#fff;padding:10px 16px;border-radius:999px;font-size:.9rem;z-index:999;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:90vw;text-align:center"; document.body.appendChild(d); } d.textContent = m; d.hidden = false; clearTimeout(d._t); d._t = setTimeout(() => d.hidden = true, 3500); };
const copyEmail = () => (navigator.clipboard ? navigator.clipboard.writeText(EMAIL) : Promise.reject()).then(() => true).catch(() => false);
document.querySelectorAll(".mail-l").forEach(a => a.addEventListener("click", () => { copyEmail().then(ok => ok && mtoast(lang === "ar" ? "تنسخ الإيميل: " + EMAIL : "Email copié : " + EMAIL)); }));
$("copyEm").onclick = () => copyEmail().then(ok => { $("copyEm").textContent = t("copied"); if (!ok) { const r = document.createRange(); r.selectNodeContents($("email")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } });
$("copyBtn").onclick = () => {
  navigator.clipboard.writeText("0662416680").then(() => $("copyBtn").textContent = t("copied"))
   .catch(() => { const r = document.createRange(); r.selectNodeContents($("phone")); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); });
};

cart = store.get("sk_cart") || {};
Object.keys(cart).forEach(id => { if (!item(id)) delete cart[id]; });
lang = store.get("sk_lang") === "ar" ? "ar" : "fr";
applyLang();
</script>
